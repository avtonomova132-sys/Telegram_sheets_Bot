    padding-bottom: 60px;

    border-bottom: 1px solid rgba(200,162,77,0.35);
    position: relative;
    overflow: hidden;
  }
  header::after{

    position:absolute;

    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--gold-soft) 20%, #fff 50%, var(--gold-soft) 80%, transparent 100%);

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
    padding: 6px 10px;
    width: 96px;
  }

  .path-dot.active .star{

let currentLang = "ru";
let currentProgram = "all";
let currentFormat = "online";

function programById(id){
  return programs.find(p => p.id === id);
}

function renderProgramNav(){
  const nav = document.getElementById("program-nav");
  nav.innerHTML = programs.map(p => `
    <div class="path-dot${p.id === currentProgram ? " active" : ""}" data-program="${p.id}">
      <div class="star"></div>
      <span class="label">${p.id === "all" ? i18n[currentLang].navAll : p.nav[currentLang]}</span>
    </div>
  `).join("");
  nav.querySelectorAll(".path-dot").forEach(dot => {
    dot.addEventListener("click", () => {
      currentProgram = dot.getAttribute("data-program");
      renderProgramNav();
      renderProgramHeader();
      render();
    });
  });
}

function renderProgramHeader(){
  const headerEl = document.getElementById("program-header");
  const aboutWrap = document.getElementById("about-wrap");

  if(currentProgram === "all"){
    headerEl.innerHTML = "";
    aboutWrap.innerHTML = "";
    return;
  }

  const p = programById(currentProgram);
  headerEl.innerHTML = `
    <h2>${p.title[currentLang]}</h2>
    <div class="program-subtitle">${p.subtitle[currentLang]}</div>
  `;

  const about = aboutTexts[currentProgram];
  const isPlaceholder = about === placeholderAbout;
  aboutWrap.innerHTML = `
    <div class="about-card">
      <div class="about-label">${i18n[currentLang].aboutLabel}</div>
      <div class="about-body${isPlaceholder ? " placeholder" : ""}">${isPlaceholder ? about[currentLang] : about[currentLang]}</div>
    </div>
  `;
}

function setLang(l){
  currentLang = l;
  document.getElementById("btn-ru").classList.toggle("active", l==="ru");
  document.getElementById("btn-en").classList.toggle("active", l==="en");
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(i18n[l][key]) el.textContent = i18n[l][key];
  });
  renderProgramNav();
  renderProgramHeader();
  render();
}

document.querySelectorAll(".format-tabs button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".format-tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFormat = btn.getAttribute("data-format");
    render();
  });
});

function getEmptyMessage(){
  if(currentProgram !== "all"){
    const progMsgs = emptyMessages[currentProgram];
    if(progMsgs && progMsgs[currentFormat]) return progMsgs[currentFormat][currentLang];
  }
  return i18n[currentLang].emptyDefault;
}

function render(){
  const t = i18n[currentLang];
  const container = document.getElementById("cards");
  const filtered = events.filter(e=>{
    const progOk = currentProgram === "all" || e.program === currentProgram;
    const fmtOk = e.format === currentFormat;
    return progOk && fmtOk;
  });
  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-note">${getEmptyMessage()}</div>`;
    return;
  }
  container.innerHTML = filtered.map(e=>{
    const title = currentLang === "ru" ? e.title_ru : e.title_en;
    const az = currentLang === "ru" ? e.az_ru : e.az_en;
    const msk = currentLang === "ru" ? e.msk_ru : e.msk_en;
    const fmtLabel = t["fmt-" + e.format];
    const programTag = currentProgram === "all"
      ? `<span class="tag program">${programById(e.program).nav[currentLang]}</span>`
      : "";
    return `
      <div class="card ${e.format}">
        <div class="tag-row">
          ${programTag}
          <span class="tag format-${e.format}">${fmtLabel}</span>
        </div>
        <h3>${title}</h3>
        <div class="meta">
          <div><b>${t.labelAZ}:</b> ${az}</div>
          <div><b>${t.labelMSK}:</b> ${msk}</div>
          <div><b>${t.labelWho}:</b> ${e.who}</div>
        </div>
        <a class="link" href="${e.link}" target="_blank" rel="noopener noreferrer">${t.labelOpen}</a>
      </div>
    `;
  }).join("");
}

renderProgramNav();
renderProgramHeader();
render();
