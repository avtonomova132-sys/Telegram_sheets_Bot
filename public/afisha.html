<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Афиша Алмазного пути</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdf7ec;
    --surface: #ffffff;
    --ink: #2b1e12;
    --ink-soft: #6b4f30;
    --gold: #e2a52d;
    --gold-deep: #b3720a;
    --gold-soft: #f7dfa0;
    --saffron: #f0900f;
    --maroon: #c1442a;
    --maroon-deep: #8f2d18;
    --sage: #45785a;
    --muted: #a08a5f;
    --line: rgba(60,40,15,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    /* Перламутровый фон: тёплая слоновая кость в основе + несколько мягких
       золотистых/жемчужных бликов разного размера и положения, чтобы фон
       слегка "переливался", а не был плоским пятном. Карточки поверх — все
       непрозрачные (var(--surface)), поэтому контраст не теряется. */
    background-color: #fdf9f0;
    background-image:
      radial-gradient(42% 32% at 12% 8%, rgba(255,255,255,0.85) 0%, transparent 70%),
      radial-gradient(38% 30% at 88% 12%, rgba(226,165,45,0.13) 0%, transparent 70%),
      radial-gradient(46% 38% at 25% 92%, rgba(240,144,15,0.08) 0%, transparent 70%),
      radial-gradient(34% 28% at 92% 88%, rgba(255,255,255,0.7) 0%, transparent 70%),
      radial-gradient(30% 24% at 55% 45%, rgba(226,165,45,0.05) 0%, transparent 70%),
      linear-gradient(160deg, #fdf9f0 0%, #f8ecd4 100%);
    background-attachment: fixed;
    position: relative;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  /* Едва заметное зерно/"пыльца" поверх фона — процедурный SVG-шум,
     без сетевого запроса, почти не влияет на вес и производительность. */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ===== Шапка ===== */
  .topbar{
    position: relative;
    display:flex;
    align-items:center;
    gap: 18px;
    padding: 14px 24px;
    background: var(--surface);
    flex-wrap: wrap;
  }
  .topbar::after{
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--saffron), var(--maroon));
  }
  .topbar-brand{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .topbar-brand .logo-icon{
    font-size: 22px;
    color: var(--gold-deep);
    line-height:1;
  }
  .brand-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
    line-height: 1.15;
    white-space: nowrap;
  }
  .brand-subtitle{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .topbar-search{
    flex: 1;
    min-width: 160px;
    max-width: 420px;
  }
  .topbar-search input{
    width: 100%;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter';
    font-size: 13px;
    outline: none;
  }
  .topbar-search input::placeholder{ color: var(--muted); }
  .topbar-search input:focus{ border-color: var(--gold); }
  .lang-toggle{
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-toggle button{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Inter';
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-toggle button.active{
    background: var(--gold);
    color: #fff;
  }

  /* ===== Ряд программ ===== */
  .program-tabs{
    display: flex;
    gap: 24px;
    overflow-x: auto;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  .program-tabs::-webkit-scrollbar{ display:none; }
  .program-tab{
    font-family: 'Inter';
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .program-tab:hover{ color: var(--ink); }
  .program-tab.active{
    color: var(--maroon);
    border-bottom-color: var(--maroon);
  }

  /* ===== Секция афиши / лента дат ===== */
  .section-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    padding: 22px 24px 4px;
  }
  .date-ribbon-wrap{
    position: relative;
    padding: 6px 24px 8px;
  }
  .date-ribbon{
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding-right: 44px;
  }
  .date-ribbon::-webkit-scrollbar{ display:none; }
  .date-cell{
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
    min-width: 44px;
    padding: 4px 8px 6px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .date-cell:hover{ background: rgba(200,162,77,0.10); }
  .date-cell.selected{ background: var(--maroon); }
  .date-cell.selected .date-num,
  .date-cell.selected .date-wd,
  .date-cell.selected .date-month{ color: #fff; }
  .date-month{
    font-size: 9.5px;
    letter-spacing: 0.05em;
    font-weight: 700;
    color: var(--gold-deep);
    min-height: 12px;
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .date-num{
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }
  .date-wd{
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .date-cell.weekend .date-num,
  .date-cell.weekend .date-wd{ color: var(--maroon); }
  .date-cell.today{ box-shadow: inset 0 0 0 1.5px var(--gold); }
  .date-scroll-arrow{
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-4px);
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  /* ===== Фильтры ===== */
  .filters-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px 18px;
    flex-wrap: wrap;
  }
  .all-filters-btn{
    font-family: 'Inter';
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .all-filters-btn:hover{ border-color: var(--gold); }
  .format-pills{ display:flex; gap: 8px; flex-wrap: wrap; }
  .format-pill{
    font-family: 'Inter';
    font-weight: 600;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: all .15s;
  }
  .format-pill.active{
    background: var(--maroon);
    border-color: var(--maroon);
    color: #fff;
  }

  /* ===== Заголовок программы + "О программе" ===== */
  .program-header{
    max-width: 720px;
    margin: 4px auto 0;
    padding: 6px 24px 0;
    text-align: center;
  }
  .program-header h2{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 24px;
    color: var(--ink);
  }
  .program-header .program-subtitle{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .about-card{
    max-width: 720px;
    margin: 16px auto 0;
    padding: 20px 22px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    box-shadow: 0 2px 12px rgba(42,38,32,0.05);
    margin-left: 24px;
    margin-right: 24px;
  }
  .about-card .about-label{
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .about-card .about-label::before{ content: "✦"; font-size: 12px; }
  .about-card .about-body{
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .about-card .about-body p{ margin-bottom: 10px; }
  .about-card .about-body p:last-child{ margin-bottom: 0; }
  .about-card .about-body.placeholder{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--muted);
  }
  .about-card .houses-list{ list-style: none; margin: 8px 0 12px; padding: 0; }
  .about-card .houses-list li{
    padding: 5px 0 5px 16px;
    border-left: 2px solid var(--gold);
    margin-bottom: 4px;
    color: var(--ink);
    font-weight: 500;
  }

  /* ===== Карточки событий — горизонтальная карусель ===== */
  .cards-wrap{
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 24px 48px;
  }
  .cards-carousel{
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    padding: 4px 2px 12px;
    scrollbar-width: thin;
  }
  .carousel-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--maroon);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(60,40,15,0.14);
    z-index: 2;
    transition: background .15s, color .15s;
  }
  .carousel-arrow:hover{ background: var(--gold); color: #fff; border-color: var(--gold); }
  .carousel-arrow.prev{ left: 4px; }
  .carousel-arrow.next{ right: 4px; }
  .event-card{
    flex: 0 0 auto;
    width: 280px;
    scroll-snap-align: start;
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 2px 12px rgba(60,40,15,0.07);
    display: flex;
    flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .event-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(60,40,15,0.14);
  }
  .event-photo{
    position: relative;
    height: 190px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .event-photo-icon{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: rgba(255,255,255,0.9);
  }
  .event-photo img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .event-body{
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }
  .badge-row{ display:flex; gap: 6px; flex-wrap: wrap; }
  .badge{
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .badge.program{ background: #3a2c1c; color: #fff; }
  .badge.format-online{ background: var(--gold); color: #3d2400; }
  .badge.format-offline{ background: var(--sage); color: #fff; }
  .badge.format-records{ background: var(--maroon); color: #fff; }
  .event-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
    color: var(--ink);
  }
  .event-meta{
    font-size: 12.5px;
    color: #5a4832;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: auto;
    padding-top: 4px;
  }
  .event-meta b{ color: var(--ink); }
  .event-link{
    margin-top: 8px;
    display: inline-block;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--maroon);
    padding: 8px 14px;
    border-radius: 999px;
    text-decoration: none;
    transition: background .15s;
  }
  .event-link:hover{ background: var(--maroon-deep); }

  .empty-note{
    flex: 1 1 100%;
    text-align:center;
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    padding: 50px 20px;
  }

  footer{
    text-align:center;
    padding: 24px 20px 30px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  @media (max-width: 560px){
    .topbar{ padding: 12px 16px; }
    .topbar-search{ order: 3; max-width: none; flex-basis: 100%; }
    .program-tabs{ padding: 12px 16px; gap: 18px; }
    .section-title{ padding: 18px 16px 4px; }
    .date-ribbon-wrap{ padding: 6px 16px 8px; }
    .filters-row{ padding: 10px 16px 16px; }
    .program-header{ padding: 6px 16px 0; }
    .about-card{ margin-left: 16px; margin-right: 16px; }
    .cards-wrap{ padding: 10px 16px 40px; }
    .carousel-arrow{ display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <span class="logo-icon">✦</span>
    <div>
      <div class="brand-title" data-i18n="title">Афиша Алмазного пути</div>
      <div class="brand-subtitle" data-i18n="subtitle">Где встретиться с Дхармой</div>
    </div>
  </div>
  <div class="topbar-search">
    <input type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Поиск по афише">
  </div>
  <div class="lang-toggle">
    <button id="btn-ru" class="active" onclick="setLang('ru')">РУС</button>
    <button id="btn-en" onclick="setLang('en')">ENG</button>
  </div>
</header>

<div class="program-tabs" id="program-nav"></div>

<div class="section-title" data-i18n="sectionTitle">Афиша событий</div>
<div class="date-ribbon-wrap">
  <div class="date-ribbon" id="date-ribbon"></div>
  <button class="date-scroll-arrow" id="date-scroll-btn" aria-label="Прокрутить">›</button>
</div>

<div class="filters-row">
  <button class="all-filters-btn" id="reset-filters-btn" data-i18n="allFilters">Все фильтры</button>
  <div class="format-pills" id="format-pills">
    <button class="format-pill active" data-format="online" data-i18n="fmt-online">Онлайн</button>
    <button class="format-pill" data-format="offline" data-i18n="fmt-offline">Офлайн</button>
    <button class="format-pill" data-format="records" data-i18n="fmt-records">Записи</button>
  </div>
</div>

<div class="program-header" id="program-header"></div>
<div id="about-wrap"></div>

<div class="cards-wrap">
  <button class="carousel-arrow prev" id="cards-prev" aria-label="Назад">‹</button>
  <main class="cards-carousel" id="cards"></main>
  <button class="carousel-arrow next" id="cards-next" aria-label="Вперёд">›</button>
</div>

<footer data-i18n="footer">Черновик · WVP 2026 · данные будут дополняться</footer>

<script>
const i18n = {
  ru: {
    title: "Афиша Алмазного пути",
    subtitle: "Где встретиться с Дхармой",
    searchPlaceholder: "Поиск по афише",
    sectionTitle: "Афиша событий",
    allFilters: "Все фильтры",
    navAll: "Все",
    "fmt-online":"Онлайн", "fmt-offline":"Офлайн", "fmt-records":"Записи",
    labelAZ: "Аризона (MST)", labelMSK: "Москва (MSK)",
    labelWho: "Ведёт", labelWhere: "Где", labelOpen: "Открыть →",
    labelCity: "Город", labelLang: "Языки",
    aboutLabel: "О программе",
    footer: "Черновик · WVP 2026 · данные будут дополняться",
    emptyDefault: "Пока нет событий в этой категории — скоро добавим"
  },
  en: {
    title: "Diamond Way Guide",
    subtitle: "Where to meet the Dharma",
    searchPlaceholder: "Search the schedule",
    sectionTitle: "Event schedule",
    allFilters: "All filters",
    navAll: "All",
    "fmt-online":"Online", "fmt-offline":"In person", "fmt-records":"Recordings",
    labelAZ: "Arizona (MST)", labelMSK: "Moscow (MSK)",
    labelWho: "Teacher", labelWhere: "Where", labelOpen: "Open →",
    labelCity: "City", labelLang: "Languages",
    aboutLabel: "About the program",
    footer: "Draft · WVP 2026 · content will keep growing",
    emptyDefault: "Nothing here yet — more coming soon"
  }
};

// Список программ — верхний ряд вкладок.
const programs = [
  { id: "all", nav: { ru: "Все", en: "All" } },
  {
    id: "xuanzang",
    nav: { ru: "Xuanzang's Tower", en: "Xuanzang's Tower" },
    title: { ru: "Xuanzang's Tower", en: "Xuanzang's Tower" },
    subtitle: { ru: "ACI с Geshe Michael Roach и переводчиками", en: "ACI with Geshe Michael Roach & translators" }
  },
  {
    id: "timothy",
    nav: { ru: "ACI c Timothy Lowenhaupt", en: "ACI with Timothy Lowenhaupt" },
    title: { ru: "ACI with Timothy Lowenhaupt", en: "ACI with Timothy Lowenhaupt" },
    subtitle: { ru: "Курсы ACI с Timothy D. Lowenhaupt", en: "ACI courses with Timothy D. Lowenhaupt" }
  },
  {
    id: "bluesky",
    nav: { ru: "Blue Sky Friends", en: "Blue Sky Friends" },
    title: { ru: "Blue Sky Friends", en: "Blue Sky Friends" },
    subtitle: { ru: "Встречи о заботе и осознанности", en: "Gatherings on care and awareness" }
  },
  {
    id: "utpala",
    nav: { ru: "ACI c Ven. Utpala", en: "ACI with Ven. Utpala" },
    title: { ru: "ACI with Ven. Utpala", en: "ACI with Ven. Utpala" },
    subtitle: { ru: "Курсы ACI с Venerable Utpala", en: "ACI courses with Venerable Utpala" }
  },
  {
    id: "domov",
    nav: { ru: "Пять домов", en: "Five Houses" },
    title: { ru: "Пять домов", en: "Five Houses" },
    subtitle: { ru: "Программа Геше Майкла Роуча", en: "A program by Geshe Michael Roach" }
  },
  {
    id: "peachtree",
    nav: { ru: "Peach Tree", en: "Peach Tree" },
    title: { ru: "Peach Tree", en: "Peach Tree" },
    subtitle: { ru: "Джецунма, Аризона", en: "Jetsunma, Arizona" }
  }
];

// Цвет/иконка фото-плейсхолдера карточки — по программе, вместо реальных фото.
const PROGRAM_VISUAL = {
  xuanzang: { gradient: "linear-gradient(135deg, #e9cf8f, #93711f)" },
  timothy: { gradient: "linear-gradient(135deg, #e3b98f, #a05a2c)" },
  bluesky: { gradient: "linear-gradient(135deg, #a8c5d6, #4c6f8a)" },
  utpala: { gradient: "linear-gradient(135deg, #cbb0d9, #6f4a82)" },
  domov: { gradient: "linear-gradient(135deg, #e3a89a, #7a3226)" },
  peachtree: { gradient: "linear-gradient(135deg, #f0c48a, #c9793f)" }
};
const PLACEHOLDER_ICON = "☸";

// Тематические заглушки-фото (статуя, свеча/подношения, горы, медитация,
// манускрипт) — назначаются по кругу событиям без своего "image". Как
// только у события появится реальное фото (поле image в /api/events),
// заглушка сама уступит место — см. assignPlaceholderImage.

// ===== Лента дат (сегодня + 30 дней) =====
const WEEKDAYS = {
  ru: ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],
  en: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
};
const MONTHS = {
  ru: ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],
  en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};
const MONTHS_FULL = {
  ru: ["ЯНВАРЬ","ФЕВРАЛЬ","МАРТ","АПРЕЛЬ","МАЙ","ИЮНЬ","ИЮЛЬ","АВГУСТ","СЕНТЯБРЬ","ОКТЯБРЬ","НОЯБРЬ","ДЕКАБРЬ"],
  en: ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"]
};

// Локальная календарная дата в ISO — без toISOString(), чтобы не съехать
// на день из-за перевода в UTC у пользователей с отрицательным смещением.
function isoOfLocalDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function buildDateRange(days){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const arr = [];
  for(let i = 0; i < days; i++){
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    arr.push(d);
  }
  return arr;
}

function renderDateRibbon(){
  const ribbon = document.getElementById("date-ribbon");
  const dates = buildDateRange(30);

  ribbon.innerHTML = dates.map((d, idx) => {
    const iso = isoOfLocalDate(d);
    const wd = d.getDay();
    const isWeekend = wd === 0 || wd === 6;
    const showMonthLabel = idx === 0 || d.getDate() === 1;
    const monthLabel = showMonthLabel ? MONTHS_FULL[currentLang][d.getMonth()] : "";
    const classes = ["date-cell"];
    if(isWeekend) classes.push("weekend");
    if(idx === 0) classes.push("today");
    if(selectedDate === iso) classes.push("selected");
    return `
      <div class="${classes.join(" ")}" data-date="${iso}">
        <div class="date-month">${monthLabel}</div>
        <div class="date-num">${d.getDate()}</div>
        <div class="date-wd">${WEEKDAYS[currentLang][wd]}</div>
      </div>
    `;
  }).join("");

  ribbon.querySelectorAll(".date-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      const iso = cell.getAttribute("data-date");
      selectedDate = selectedDate === iso ? null : iso;
      renderDateRibbon();
      render();
    });
  });
}

function getEmptyMessage(){
  if(currentProgram !== "all"){
    const progMsgs = emptyMessages[currentProgram];
    if(progMsgs && progMsgs[currentFormat]) return progMsgs[currentFormat][currentLang];
  }
  return i18n[currentLang].emptyDefault;
}

function render(){
  const t = i18n[currentLang];
  const container = document.getElementById("cards");
  const filtered = events.filter(e=>{
    const progOk = currentProgram === "all" || e.program === currentProgram;
    const fmtOk = e.format === currentFormat;
    const dateOk = !selectedDate || e.date_az_iso === selectedDate;
    return progOk && fmtOk && dateOk;
  });
  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-note">${getEmptyMessage()}</div>`;
    return;
  }
  container.innerHTML = filtered.map(e=>{
    const title = currentLang === "ru" ? e.title_ru : e.title_en;
    const az = currentLang === "ru" ? e.az_ru : e.az_en;
    const msk = currentLang === "ru" ? e.msk_ru : e.msk_en;
    const fmtLabel = t["fmt-" + e.format];
    const visual = PROGRAM_VISUAL[e.program] || PROGRAM_VISUAL.xuanzang;
    const programBadge = currentProgram === "all"
      ? `<span class="badge program">${programById(e.program).nav[currentLang]}</span>`
      : "";
    return `
      <div class="event-card">
        <div class="event-photo" style="background:${visual.gradient}">
          <span class="event-photo-icon">${PLACEHOLDER_ICON}</span>
          <img src="${e.image}" alt="" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="event-body">
          <div class="badge-row">
            ${programBadge}
            <span class="badge format-${e.format}">${fmtLabel}</span>
          </div>
          <div class="event-title">${title}</div>
          <div class="event-meta">
            ${az ? `<div><b>${t.labelAZ}:</b> ${az}</div>` : ""}
            ${msk ? `<div><b>${t.labelMSK}:</b> ${msk}</div>` : ""}
            <div><b>${t.labelWho}:</b> ${e.who}</div>

            ${e.lang ? `<div><b>${t.labelLang}:</b> ${e.lang}</div>` : ""}
          </div>
          <a class="event-link" href="${e.link}" target="_blank" rel="noopener noreferrer">${t.labelOpen}</a>

const PROGRAM_ID_BY_NAME = {

  "Xuanzang's Tower": "xuanzang",

  "Blue Sky Friends": "bluesky",

function formatApiDate(iso, time, lang){
  if(!iso || !time) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const wd = WEEKDAYS[lang][dt.getUTCDay()];
  const mo = MONTHS[lang][m - 1];
  return lang === "ru" ? `${wd}, ${d} ${mo} ${y}, ${time}` : `${wd}, ${mo} ${d}, ${y}, ${time}`;
}

// Приводит запись из /api/events (схема events/store.js на сервере) к
// формату карточки, которым уже оперирует render(). Событие с программой,
// не входящей в PROGRAM_ID_BY_NAME, пропускается — лучше молча скрыть
// нераспознанную запись, чем уронить страницу.
function mapApiEvent(e){
  const program = PROGRAM_ID_BY_NAME[e.program];
  if(!program) return null;
  const format = e.format === "recording" ? "records" : e.format;
  const title_ru = e.title_ru || e.teacher || "";
  const title_en = e.title_en || e.teacher || "";
  return {
    program, format,
    date_az_iso: e.date_az || null,
    title_ru, title_en,
    az_ru: formatApiDate(e.date_az, e.time_az, "ru"),
    az_en: formatApiDate(e.date_az, e.time_az, "en"),
    msk_ru: formatApiDate(e.date_msk, e.time_msk, "ru"),
    msk_en: formatApiDate(e.date_msk, e.time_msk, "en"),
    who: e.teacher || "—",
    city: e.city || "",
    lang: e.lang || "",
    link: e.link || "#",
    image: e.image || ""
  };
}

// События из /api/events (добавленные через /new в боте) дополняют
// захардкоженный список выше. Если запрос не удался или вернул пусто —
// просто остаёмся на захардкоженных данных, страница не должна быть пустой.
async function loadApiEvents(){
  try {
    const res = await fetch("/api/events");
    if(!res.ok) return;
    const data = await res.json();
    if(Array.isArray(data) && data.length > 0){
      const mapped = data.map(mapApiEvent).filter(Boolean);
      mapped.forEach(assignPlaceholderImage);
      events.push(...mapped);
    }
  } catch (err) {
    console.warn("Не удалось загрузить события с сервера, показываю сохранённые данные:", err);
  } finally {
    renderProgramTabs();
    renderProgramHeader();
    renderDateRibbon();
    render();
  }
}

events.forEach(assignPlaceholderImage);

document.getElementById("cards-prev").addEventListener("click", () => {
  document.getElementById("cards").scrollBy({ left: -300, behavior: "smooth" });
});
document.getElementById("cards-next").addEventListener("click", () => {
  document.getElementById("cards").scrollBy({ left: 300, behavior: "smooth" });
});

renderProgramTabs();
renderProgramHeader();
renderDateRibbon();
render();
loadApiEvents();
</script>
</body>
</html>
